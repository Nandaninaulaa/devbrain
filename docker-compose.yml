services:
  neo4j:
    image: neo4j:5.24-community
    environment:
      # Matches backend/.env.example defaults — change both together if you customize.
      NEO4J_AUTH: neo4j/devbrain123
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"   # Neo4j browser UI, optional but handy for poking at the graph directly
      - "7687:7687"   # Bolt protocol, used by the backend
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      EMBEDDING_PROVIDER: local
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: devbrain123
      CHROMA_DIR: /app/data/chroma
    volumes:
      - chroma_data:/app/data/chroma
      # Mount your local projects read-only so you can point /ingest at them
      # from inside the container, e.g. folder: "/host-projects/nutritrack".
      - ${HOST_PROJECTS_DIR:-./}:/host-projects:ro
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  chroma_data:
  neo4j_data:
